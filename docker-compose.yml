services:
  mobile:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start:docker:mobile"
    restart: unless-stopped
    environment:
      - EXPO_NO_TELEMETRY=1
      - CHOKIDAR_USEPOLLING=1
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/status | grep -q packager-status"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 45s
    stdin_open: true
    tty: true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start:docker:web"
    restart: unless-stopped
    environment:
      - EXPO_NO_TELEMETRY=1
      - CHOKIDAR_USEPOLLING=1
      - CI=1
    ports:
      - "19006:19006"
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:19006 >/dev/null"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 60s
    stdin_open: true
    tty: true
